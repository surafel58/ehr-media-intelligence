[project]
name = "ehr-platform"
version = "0.1.0"
description = "EHR Media Intelligence Platform: clean raw EHR data, map it to FHIR R4, summarize it with an LLM, and search it."
readme = "README.md"
authors = [
    { name = "surafel", email = "surafel.s.tadesse@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.11",
    "fhir-resources>=8.3",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
